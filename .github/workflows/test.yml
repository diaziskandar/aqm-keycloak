name: Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres-inventory:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: erp_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgres-order:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: erp_order
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      keycloak-db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_PASSWORD: password123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build eureka-server
        run: |
          cd eureka-server
          mvn clean package -DskipTests
          cd ..

      - name: Build api-gateway
        run: |
          cd api-gateway
          mvn clean package -DskipTests
          cd ..

      - name: Build inventory-service
        run: |
          cd inventory-service
          mvn clean package -DskipTests
          cd ..

      - name: Build order-service
        run: |
          cd order-service
          mvn clean package -DskipTests
          cd ..

      - name: Run unit tests
        run: |
          mvn clean test -T 1C --fail-at-end
